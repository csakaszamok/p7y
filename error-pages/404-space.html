<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Not found</title>
<!-- Self-contained: no request leaves this page. Purgatorium serves it with the portal's address (PUBLIC_URL) in place
     of {{P9M_URL}}; without it the script below guesses p9m.<domain>. One of the 404-*.html pages, picked at random. -->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { height: 100%; margin: 0 }
  body {
    overflow: hidden; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #ede6df;
    background: radial-gradient(ellipse at 70% 20%, #2a1b4a 0%, #120d26 40%, #07060f 100%) fixed;
  }
  main { position: absolute; z-index: 10; top: 12%; left: 50%; transform: translateX(-50%); width: min(480px, calc(100% - 32px)); text-align: center }
  .code {
    margin: 0; font: 800 clamp(64px, 16vw, 112px)/1 ui-monospace, Consolas, monospace; letter-spacing: .04em;
    background: linear-gradient(180deg, #ffb066, #ea580c 60%, #7c2d12); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 22px; margin: 6px 0 }
  p { color: #a8a09a; margin: 0 0 18px }
  code { color: #ede6df; word-break: break-all }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center }
  a, button {
    font: inherit; cursor: pointer; text-decoration: none; padding: 9px 16px; border-radius: 8px;
    border: 1px solid #3a2a20; background: #1e1611cc; color: #ede6df;
  }
  a:hover, button:hover { border-color: #ea580c }
  .primary { background: #ea580c; border-color: #ea580c; color: #fff }
  .primary:hover { background: #f97316 }
  [hidden] { display: none }

  /* the agent: blinking, its antenna glowing */
  .eyes { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1) } 97% { transform: scaleY(.1) } }
  .tip { animation: tip 1.6s ease-in-out infinite alternate }
  @keyframes tip { from { fill: #ff8a2a } to { fill: #ffe0a0 } }
  svg.agent { overflow: visible; display: block }

  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .2; animation: twinkle 3s ease-in-out infinite alternate }
  @keyframes twinkle { to { opacity: .9 } }
  .planet { position: absolute; right: -60px; bottom: -80px; width: 320px; opacity: .95 }
  /* agents drift slowly across, bobbing and tumbling */
  .drift { position: absolute; left: 0; top: 0; animation: across linear infinite }
  .drift > div { animation: bob ease-in-out infinite alternate }
  .drift svg { animation: spin linear infinite }
  @keyframes across { from { transform: translate(-25vw, var(--y0)) } to { transform: translate(115vw, var(--y1)) } }
  @keyframes bob { from { transform: translateY(-14px) } to { transform: translateY(14px) } }
  @keyframes spin { to { transform: rotate(360deg) } }
  .sign { font: 800 22px ui-monospace, Consolas, monospace }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="agent" viewBox="0 0 100 130">
      <g stroke="#1b1424" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M31 84 L13 99" stroke-width="13" fill="none"/><path d="M31 84 L13 99" stroke="currentColor" stroke-width="7" fill="none"/>
        <path d="M69 84 L87 72" stroke-width="13" fill="none"/><path d="M69 84 L87 72" stroke="currentColor" stroke-width="7" fill="none"/>
        <path d="M41 108 V123 M59 108 V123" stroke-width="13" fill="none"/><path d="M41 108 V123 M59 108 V123" stroke="currentColor" stroke-width="7" fill="none"/>
        <line x1="50" y1="21" x2="50" y2="9"/>
        <circle class="tip" cx="50" cy="7" r="5" fill="#ff8a2a"/>
        <rect x="8" y="36" width="10" height="20" rx="4" fill="#ff8a2a"/><rect x="82" y="36" width="10" height="20" rx="4" fill="#ff8a2a"/>
        <rect x="15" y="20" width="70" height="52" rx="19" fill="currentColor"/>
        <rect x="23" y="29" width="54" height="31" rx="14" fill="#1b1424"/>
        <g class="eyes"><ellipse cx="40" cy="43" rx="5" ry="6.5" fill="#7ff6ff" stroke="none"/><ellipse cx="60" cy="43" rx="5" ry="6.5" fill="#7ff6ff" stroke="none"/></g>
        <path d="M44 52 Q50 56.5 56 52" stroke="#7ff6ff" stroke-width="2.5" fill="none"/>
        <rect x="28" y="74" width="44" height="36" rx="14" fill="currentColor"/>
        <circle cx="50" cy="91" r="6" fill="#ff8a2a"/>
        <ellipse cx="30" cy="29" rx="8" ry="4" fill="#fff" opacity=".45" stroke="none" transform="rotate(-25 30 29)"/>
      </g>
    </symbol>
    <!-- the agent carrying a container --><symbol id="carrier" viewBox="0 0 100 130">
      <g stroke="#1b1424" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M41 108 V123 M59 108 V123" stroke-width="13" fill="none"/><path d="M41 108 V123 M59 108 V123" stroke="currentColor" stroke-width="7" fill="none"/>
        <line x1="50" y1="21" x2="50" y2="9"/>
        <circle class="tip" cx="50" cy="7" r="5" fill="#ff8a2a"/>
        <rect x="8" y="36" width="10" height="20" rx="4" fill="#ff8a2a"/><rect x="82" y="36" width="10" height="20" rx="4" fill="#ff8a2a"/>
        <rect x="15" y="20" width="70" height="52" rx="19" fill="currentColor"/>
        <rect x="23" y="29" width="54" height="31" rx="14" fill="#1b1424"/>
        <g class="eyes"><ellipse cx="40" cy="43" rx="5" ry="6.5" fill="#7ff6ff" stroke="none"/><ellipse cx="60" cy="43" rx="5" ry="6.5" fill="#7ff6ff" stroke="none"/></g>
        <path d="M44 52 Q50 56.5 56 52" stroke="#7ff6ff" stroke-width="2.5" fill="none"/>
        <rect x="28" y="74" width="44" height="36" rx="14" fill="currentColor"/>
        <circle cx="50" cy="91" r="6" fill="#ff8a2a"/>
        <ellipse cx="30" cy="29" rx="8" ry="4" fill="#fff" opacity=".45" stroke="none" transform="rotate(-25 30 29)"/>
        <path d="M31 84 L20 104 M69 84 L80 104" stroke-width="13" fill="none"/><path d="M31 84 L20 104 M69 84 L80 104" stroke="currentColor" stroke-width="7" fill="none"/>
      </g>
      <use href="#crate" x="18" y="90" width="64" height="41.6"/>
      <g stroke="#1b1424" stroke-width="3"><circle cx="20" cy="106" r="6" fill="currentColor"/><circle cx="80" cy="106" r="6" fill="currentColor"/></g>
    </symbol>
    <symbol id="crate" viewBox="0 0 40 26">
      <rect x="1.5" y="1.5" width="37" height="23" rx="2" fill="#c2410c" stroke="#1b1424" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M7 4.5v17M33 4.5v17" stroke="#7c2d12" stroke-width="1.6"/>
      <rect x="10" y="7.5" width="20" height="11" rx="1.5" fill="#fff6e8" stroke="#1b1424" stroke-width="1.5"/>
      <text x="20" y="15.8" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-weight="800" font-size="8" fill="#1b1424">app</text>
    </symbol>
    <radialGradient id="coal" cx="50%" cy="60%" r="60%"><stop offset="0" stop-color="#ffe3a8"/><stop offset=".3" stop-color="#ff9a3c"/><stop offset=".75" stop-color="#c2410c"/><stop offset="1" stop-color="#5a1604"/></radialGradient>
  </defs>
</svg>

<div data-stars aria-hidden="true"></div>
<svg class="planet" viewBox="0 0 320 260" aria-hidden="true">
  <ellipse cx="160" cy="150" rx="150" ry="34" fill="none" stroke="#ffb066" stroke-width="6" opacity=".55" transform="rotate(-14 160 150)"/>
  <circle cx="160" cy="150" r="92" fill="url(#coal)"/>
  <path d="M14 160 A150 34 -14 0 0 306 120" fill="none" stroke="#ffd29a" stroke-width="6" opacity=".9"/>
  <circle cx="120" cy="120" r="14" fill="#7c2d12" opacity=".35"/><circle cx="190" cy="180" r="9" fill="#7c2d12" opacity=".35"/>
</svg>

<div aria-hidden="true">
  <div class="drift" style="--y0: 58vh; --y1: 40vh; animation-duration: 70s; animation-delay: -12s"><div style="animation-duration: 4s">
    <svg class="agent" width="110" height="143" viewBox="0 0 100 130" style="color:#f2efe9; animation-duration: 38s"><use href="#carrier" width="100" height="130"/></svg></div></div>
  <div class="drift" style="--y0: 30vh; --y1: 66vh; animation-duration: 95s; animation-delay: -60s"><div style="animation-duration: 5s">
    <svg class="agent" width="74" height="96" viewBox="0 0 100 130" style="color:#8bd3ff; animation-duration: 26s; animation-direction: reverse"><use href="#carrier" width="100" height="130"/></svg></div></div>
  <div class="drift" style="--y0: 72vh; --y1: 62vh; animation-duration: 120s; animation-delay: -30s"><div style="animation-duration: 6s">
    <svg class="agent" width="52" height="68" viewBox="0 0 100 130" style="color:#c4a7ff; animation-duration: 18s"><use href="#carrier" width="100" height="130"/></svg></div></div>
  <!-- the one holding the sign does not tumble -->
  <div class="drift" style="--y0: 46vh; --y1: 52vh; animation-duration: 80s; animation-delay: -48s"><div style="animation-duration: 3.5s">
    <svg class="agent" width="150" height="190" viewBox="-25 -60 150 190" style="color:#ffb066; animation: none">
      <path d="M50 -4 L50 18" stroke="#1b1424" stroke-width="3"/>
      <rect x="-10" y="-52" width="120" height="50" rx="8" fill="#fff6e8" stroke="#1b1424" stroke-width="3" transform="rotate(-6 50 -27)"/>
      <text class="sign" x="50" y="-17" text-anchor="middle" fill="#c2410c" transform="rotate(-6 50 -27)">404?</text>
      <use href="#agent" width="100" height="130"/>
    </svg></div></div>
</div>

<main>
  <p class="code">404</p>
  <h1>Houston, we have a 404</h1>
  <p>There is no page at <code id="where"></code>. It drifted off into space; our agents went out to find it and have not come back yet. If it is a sandbox app, the sandbox may have been deleted or archived.</p>
  <div class="actions">
    <button type="button" id="back" hidden>Go back</button>
    <a href="/" id="home" hidden>Start page of this site</a>
    <a href="{{P9M_URL}}" id="portal" class="primary">Open the sandbox portal</a>
  </div>
</main>
<script>
  (function () {
    var host = location.hostname
    document.getElementById('where').textContent = host + location.pathname
    if (history.length > 1) {
      var back = document.getElementById('back')
      back.hidden = false
      back.onclick = function () { history.back() }
    }
    if (location.pathname !== '/') document.getElementById('home').hidden = false
    var portal = document.getElementById('portal')
    // Not filled in by Purgatorium: p9m.<the domain this host is under>
    if (portal.getAttribute('href').indexOf('{{') === 0) {
      var parts = host.split('.')
      var domain = parts.length > 2 ? parts.slice(1).join('.') : host
      portal.href = location.protocol + '//p9m.' + domain
    }

    var stars = document.querySelector('[data-stars]')
    for (var i = 0; i < 140; i++) {
      var s = document.createElement('i'); s.className = 'star'
      s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'
      s.style.animationDelay = -Math.random() * 3 + 's'; s.style.animationDuration = 2 + Math.random() * 3 + 's'
      if (Math.random() < .15) { s.style.width = s.style.height = '3px' }
      stars.appendChild(s)
    }
  })()
</script>
</body>
</html>
