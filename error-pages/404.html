<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Not found</title>
<!-- Self-contained: no request leaves this page. p7y-init writes the portal's address (PUBLIC_URL) in place of
     {{P7Y_URL}}; without it the script below guesses p7y.<domain>. -->
<style>
  :root { color-scheme: dark }
  * { box-sizing: border-box }
  html, body { height: 100% }
  body {
    margin: 0; display: grid; place-items: center; padding: 24px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #e8e2dc;
    background: radial-gradient(ellipse at 50% 120%, #3a1606 0%, #140b07 45%, #0b0908 100%) fixed;
  }
  main { max-width: 440px; text-align: center }
  .code {
    font: 700 clamp(72px, 20vw, 120px)/1 ui-monospace, Consolas, monospace; letter-spacing: .04em; margin: 0;
    background: linear-gradient(180deg, #ffb066, #ea580c 60%, #7c2d12); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 20px; margin: 12px 0 8px }
  p { color: #a8a09a; margin: 0 0 24px }
  code { color: #e8e2dc; word-break: break-all }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center }
  a, button {
    font: inherit; cursor: pointer; text-decoration: none; padding: 9px 16px; border-radius: 8px;
    border: 1px solid #3a2a20; background: #1e1611; color: #e8e2dc;
  }
  a:hover, button:hover { border-color: #ea580c }
  .primary { background: #ea580c; border-color: #ea580c; color: #fff }
  .primary:hover { background: #f97316 }
  [hidden] { display: none }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Nothing here</h1>
  <p>There is no page at <code id="where"></code>. If it is a sandbox app, the sandbox may have been deleted or archived, or the app has no such page.</p>
  <div class="actions">
    <button type="button" id="back" hidden>Go back</button>
    <a href="/" id="home" hidden>Start page of this site</a>
    <a href="{{P7Y_URL}}" id="portal" class="primary">Open the sandbox portal</a>
  </div>
</main>
<script>
  (function () {
    var host = location.hostname
    document.getElementById('where').textContent = host + location.pathname
    if (history.length > 1) {
      var back = document.getElementById('back')
      back.hidden = false
      back.onclick = function () { history.back() }
    }
    if (location.pathname !== '/') document.getElementById('home').hidden = false
    var portal = document.getElementById('portal')
    // Not filled in by p7y-init: p7y.<the domain this host is under>
    if (portal.getAttribute('href').indexOf('{{') === 0) {
      var parts = host.split('.')
      var domain = parts.length > 2 ? parts.slice(1).join('.') : host
      portal.href = location.protocol + '//p7y.' + domain
    }
  })()
</script>
</body>
</html>
