name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # A fix for an older series (v0.3.2 after v0.4.0) must not become `latest`
      - id: latest
        run: |
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$newest" = "$GITHUB_REF_NAME" ]; then echo "is_latest=true" >> "$GITHUB_OUTPUT"; else echo "is_latest=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Before anything is pushed: the compose file attached to the release must run this tag's image
      - run: bash scripts/check-release-version.sh "${{ github.ref_name }}"

      # Docker Hub's pull limit for anonymous pulls is shared by GitHub's runners (429 on the base image);
      # logged in it is far higher. Skipped without the secret (e.g. a pull request from a fork).
      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v0.1.0 → 0.1.0, 0.1 and (the highest version only) latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          LATEST: ${{ steps.latest.outputs.is_latest }}
        run: |
          version=${TAG#v}
          # The section of CHANGELOG.md for this version, without its heading
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]")) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          # The install files of this release: the compose file, the scripts, and env.example (no leading dot in an asset name)
          mkdir dist
          cp docker-compose.yml check-host.sh dist/
          cp .env.example dist/env.example
          sed "s/^P7Y_RELEASE=.*/P7Y_RELEASE=$TAG/" setup.sh > dist/setup.sh
          grep -q "^P7Y_RELEASE=$TAG\$" dist/setup.sh
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --latest="$LATEST" dist/*

      - name: The release has its install files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in check-host.sh docker-compose.yml setup.sh env.example; do
            echo "$assets" | grep -qx "$f" || { echo "missing release asset: $f"; exit 1; }
          done
